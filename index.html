<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cataract Detection Project</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(120deg, #e0f7fa, #fce4ec);
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #1e3a8a;
    }
    h2 {
      color: #b91c1c;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      background: linear-gradient(45deg, #1e40af, #1d4ed8);
    }
    img {
      max-width: 120px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="college_logo.png." alt="College Logo" width="120">

    <h1>JSPM's Jayawantrao Sawant College of Engineering, Hadapsar</h1>
    <h2>👩‍💻 Cataract Detection using CNN</h2>
    <p>Developed by: <b>Nandini</b></p>
    <a href="http://localhost:8501" class="btn">🚀 Open Project</a>
  </div>
</body>
</html>
